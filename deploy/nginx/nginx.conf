# Configuracao de Proxy Reverso Seguro Nginx para o Monitor APS Pacuja
# NUNCA exponha a porta 5000 diretamente a Internet. O Gunicorn escuta em 127.0.0.1.

# Zonas de Rate Limiting por IP (Protecao contra Forca Bruta e DoS)
limit_req_zone $binary_remote_addr zone=siaps_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=siaps_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=siaps_sync:10m rate=2r/m;

# Redirecionamento obrigatorio de HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aps.pacuja.ce.gov.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Principal HTTPS Seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aps.pacuja.ce.gov.br;
    server_tokens off;

    # Certificados SSL/TLS (Let's Encrypt ou Certificado Oficial do Municipio)
    ssl_certificate /etc/letsencrypt/live/aps.pacuja.ce.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aps.pacuja.ce.gov.br/privkey.pem;

    # Protocolos e Cifras Criptograficas Seguras (TLS 1.2 e 1.3 apenas)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Protecao contra Ataques de Buffer Overflow e Inundacao
    client_max_body_size 2M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Cabecalhos de Seguranca Estritos (OWASP ASVS / Mozilla Observatory A+)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # Restricao de Metodos HTTP (Apenas GET, POST, PUT, DELETE permitidos)
    if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS)$ ) {
        return 405;
    }

    # Rota de Login com Protecao de Forca Bruta Restrita
    location /api/auth/login {
        limit_req zone=siaps_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rota de Sincronizacao com Limitador Restrito
    location /api/sync {
        limit_req zone=siaps_sync burst=2 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Arquivos Estaticos (Cache seguro com validacao)
    location /static/ {
        alias /opt/siaps-pacuja-monitor/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Proxy Principal para a Aplicacao Flask/Gunicorn (Isolada em Loopback)
    location / {
        limit_req zone=siaps_general burst=30 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
