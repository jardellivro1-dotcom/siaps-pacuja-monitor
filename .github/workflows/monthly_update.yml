name: Rotina Mensal - Sincronizacao Oficial Siaps Pacuja

on:
  schedule:
    # Executa automaticamente todo dia 5 de cada mes as 06:00 UTC (03:00 Brasilia)
    - cron: '0 6 5 * *'
  workflow_dispatch:
    # Permite disparo manual direto pelo GitHub

jobs:
  monthly_sync:
    name: Sincronizar Novos Dados Oficiais do Siaps
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Rotina Mensal de Captura
        run: |
          python scripts/monthly_update.py

      - name: Verificar e Publicar Atualizacoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(siaps): rotina mensal automatizada - novos dados oficiais [skip ci]"
            git push
            echo "Novos dados detectados e publicados com sucesso!"
          else
            echo "Nenhum arquivo novo publicado pelo Siaps. Dados oficiais permanecem inalterados."
          fi
